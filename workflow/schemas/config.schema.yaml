---
$schema: "https://json-schema.org/draft/2020-12/schema"
description: genbank_to_replicon_workflow configuration
type: object
properties:
  input:
    type: object
    properties:
      mode:
        type: string
        enum: ["genbank", "fasta_gff"]
      genbank:
        type: string
      fasta:
        type: string
      gff3:
        type: string
      contig_name:
        type: string
      genes:
        type: object
        additionalProperties:
          type: string
    required: ["mode", "contig_name"]
  base_genome:
    type: object
    properties:
      fasta:
        type: string
      genes_gff:
        type: string
      transcripts_gff:
        type: string
  igv_genome:
    type: object
    properties:
      id:
        type: string
      name:
        type: string
    required: ["id", "name"]
  output_prefix:
    type: string
required: ["igv_genome", "output_prefix"]
# `input` (replicon) may be omitted for a base-genome-only build, in which
# case base_genome must provide the fasta and both GFFs.
anyOf:
  - required: ["input"]
  - properties:
      base_genome:
        required: ["fasta", "genes_gff", "transcripts_gff"]
    required: ["base_genome"]
